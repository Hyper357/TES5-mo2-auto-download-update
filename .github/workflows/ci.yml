name: CI

on:
  push:
    branches:
      - main
      - optimize/deterministic-mod-selection
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: npm run check

      - name: PowerShell syntax checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('scripts/mo2-ui-state.ps1', 'scripts/wake-mo2-download.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $detail = ($errors | ForEach-Object { "$file:$($_.Extent.StartLineNumber): $($_.Message)" }) -join "`n"
              throw "PowerShell parse errors:`n$detail"
            }
          }

      - name: Regression tests
        run: npm test
