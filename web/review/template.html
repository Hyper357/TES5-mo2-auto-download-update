<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TES5 MO2 自动更新 · 文件选择器</title>
  <style>/*__STYLE__*/</style>
</head>
<body>
<div class="wrap">
  <div class="hero" __AUTO_MARKER__>
    <div class="hero-top">
      <div>
        <h1>📦 MO2 更新文件选择器</h1>
        <div class="muted">直接从 Nexus 最近文件里勾选你要下载的项目。一个 MOD 可以多选；未勾选就不会下载。</div>
      </div>
      <div class="run-meta" id="run-meta"></div>
    </div>
    <div id="zero-warning"></div>
    <div class="summary" id="auto-summary"></div>
    <div class="summary" id="summary"></div>
  </div>

  <section class="download-log" id="download-log" hidden>
    <div class="download-log-head">
      <div>
        <div class="download-log-title">🧾 下载实时日志</div>
        <div class="muted">任务运行时实时显示当前下载与失败 MOD；失败项会保留 exact modId:fileId 和 errorCode。</div>
      </div>
      <span class="download-log-state" id="download-log-state">IDLE</span>
    </div>
    <div class="summary" id="download-log-summary"></div>
    <div class="download-log-block" id="download-log-active-block" hidden>
      <div class="download-log-label">当前处理中</div>
      <div class="download-log-list" id="download-log-active"></div>
    </div>
    <div class="download-log-block">
      <div class="download-log-label">失败 / 阻断</div>
      <div class="download-log-list" id="download-log-failures"></div>
    </div>
    <div class="download-log-foot" id="download-log-foot"></div>
  </section>

  <div class="toolbar">
    <div class="filters" id="filters"></div>
    <div class="toolbar-right">
      <input id="search" class="search" type="search" autocomplete="off" placeholder="搜索 MOD / 文件名 / modId…">
      <span class="visible-status" id="visible-status"></span>
    </div>
  </div>

  <main id="root"></main>
  <div class="more-wrap"><button class="btn secondary" id="more" hidden>显示更多</button></div>
</div>

<div class="selection-bar">
  <div class="selection-left">
    <div class="selection-summary" id="selection-summary">已选择 0 个文件 / 0 个 MOD</div>
    <span class="status" id="status"></span>
  </div>
  <div class="selection-actions">
    <button class="btn secondary" id="clear-selection" disabled>清空选择</button>
    <button class="btn primary" id="download" disabled>下载所选文件</button>
  </div>
</div>

<script>window.REVIEW_DATA=__REVIEW_DATA__;</script>
<script>
(() => {
  if (location.protocol === 'file:') return;
  const nativeFetch = window.fetch.bind(window);

  function badId(value) {
    const s = String(value ?? '').trim();
    return !s || /^(undefined|null)$/i.test(s);
  }

  function componentGroups(item) {
    if (item?.componentFamilies?.length) return item.componentFamilies;
    return (item?.patchFamilies || []).map(f => ({ kind: 'PATCH', ...f }));
  }

  function itemIsActionable(item) {
    if (!item) return false;
    if (item.reviewClass) return item.reviewClass === 'actionable';
    if (item.action === 'HOLD_UPDATE_ELIGIBILITY') return false;
    return (item.mainOptions || []).length > 1 || componentGroups(item).length > 0;
  }

  function allowedExactKeys(item) {
    const source = Array.isArray(item?.recentNexusFiles) && item.recentNexusFiles.length
      ? item.recentNexusFiles
      : [
          ...(item?.mainOptions || []),
          ...componentGroups(item).flatMap(g => (g.candidates || []).filter(x => String(x.modId || item.modId) === String(item.modId))),
        ];
    const out = new Set();
    for (const f of source) {
      const modId = String(f?.modId || item?.modId || '').trim();
      const fileId = String(f?.fileId ?? f?.file_id ?? '').trim();
      const current = !!f?.current || fileId === String(item?.localFileId || '');
      if (badId(modId) || badId(fileId) || current || f?.active === false || f?.selectable === false) continue;
      out.add(`${modId}:${fileId}`);
    }
    return out;
  }

  function normalizeSavedFile(raw, item, allowed) {
    const primitive = typeof raw === 'string' || typeof raw === 'number';
    const rawFileId = primitive ? raw : (raw?.fileId ?? raw?.file_id ?? '');
    const rawModId = primitive ? '' : (raw?.modId ?? raw?.mod_id ?? '');
    const fileId = String(rawFileId ?? '').trim();
    const modId = String(badId(rawModId) ? (item?.modId || '') : rawModId).trim();
    if (badId(modId) || badId(fileId)) return null;
    const key = `${modId}:${fileId}`;
    return allowed.has(key) ? { modId, fileId } : null;
  }

  function repairSavedReviewState(payload) {
    const envelope = payload?.decisions;
    const source = envelope?.decisions && typeof envelope.decisions === 'object'
      ? envelope.decisions
      : (envelope && typeof envelope === 'object' ? envelope : {});
    const items = new Map((window.REVIEW_DATA?.items || []).map(item => [String(item.id), item]));
    const repaired = {};
    let kept = 0;
    let dropped = 0;
    let migrated = 0;

    for (const [id, decision] of Object.entries(source)) {
      const item = items.get(String(id));
      const selected = Array.isArray(decision?.selectedFiles) ? decision.selectedFiles : [];
      if (!item || !itemIsActionable(item) || !selected.length) {
        dropped += selected.length;
        continue;
      }
      const allowed = allowedExactKeys(item);
      const clean = [];
      const seen = new Set();
      for (const raw of selected) {
        const normalized = normalizeSavedFile(raw, item, allowed);
        if (!normalized) {
          dropped++;
          continue;
        }
        if (typeof raw !== 'object' || badId(raw?.modId)) migrated++;
        const key = `${normalized.modId}:${normalized.fileId}`;
        if (seen.has(key)) continue;
        seen.add(key);
        clean.push(normalized);
        kept++;
      }
      if (clean.length) repaired[id] = { selectedFiles: clean };
    }

    if (envelope?.decisions && typeof envelope.decisions === 'object') {
      payload.decisions = { ...envelope, decisions: repaired };
    } else {
      payload.decisions = repaired;
    }
    window.__REVIEW_STATE_REPAIR__ = { kept, dropped, migrated };
    if (dropped > 0) {
      setTimeout(() => {
        const status = document.getElementById('status');
        if (status) status.textContent = `已清理 ${dropped} 个无效旧选择；请重新勾选需要下载的文件。`;
      }, 0);
    }
    return payload;
  }

  window.fetch = async function patchedReviewFetch(input, init) {
    let nextInit = init;
    let method = String(init?.method || (input instanceof Request ? input.method : 'GET')).toUpperCase();
    const rawUrl = typeof input === 'string' ? input : input?.url;
    const pathname = rawUrl ? new URL(rawUrl, location.href).pathname : '';

    try {
      if (method === 'POST' && (pathname === '/api/download' || pathname === '/api/save') && typeof init?.body === 'string') {
        const body = JSON.parse(init.body || '{}');
        if (body && body.decisions && typeof body.decisions === 'object') {
          repairSavedReviewState(body);
          nextInit = { ...init, body: JSON.stringify(body) };
        }
      }
    } catch (_) {
      // Backend allow-list remains authoritative if client-side cleanup cannot run.
    }

    const response = await nativeFetch(input, nextInit);
    try {
      method = String(nextInit?.method || (input instanceof Request ? input.method : 'GET')).toUpperCase();
      if (method === 'GET' && pathname === '/api/state' && response.ok) {
        const payload = repairSavedReviewState(await response.clone().json());
        const headers = new Headers(response.headers);
        headers.delete('content-length');
        return new Response(JSON.stringify(payload), { status: response.status, statusText: response.statusText, headers });
      }
    } catch (_) {
      // If migration itself fails, return the original response and keep the UI usable.
    }
    return response;
  };
})();
</script>
<script>/*__APP__*/</script>
<script>
(() => {
  if (location.protocol === 'file:') return;

  const logPanel = document.getElementById('download-log');
  const logState = document.getElementById('download-log-state');
  const logSummary = document.getElementById('download-log-summary');
  const logActiveBlock = document.getElementById('download-log-active-block');
  const logActive = document.getElementById('download-log-active');
  const logFailures = document.getElementById('download-log-failures');
  const logFoot = document.getElementById('download-log-foot');

  function shortText(value, max = 220) {
    const text = String(value || '').replace(/\s+/g, ' ').trim();
    return text.length > max ? text.slice(0, max) + '…' : text;
  }

  function failedCheckDetail(job) {
    try {
      const doc = JSON.parse(String(job?.stdout || ''));
      const failed = (doc.checks || []).filter(x => x && x.ok === false);
      if (!failed.length) return '';
      return failed.slice(0, 4).map(check => {
        const name = String(check?.name || 'CHECK');
        const detail = check?.detail || {};
        if (name === 'API_KEY_FILE') return 'API_KEY_FILE：未读取到 Nexus API Key';
        if (name === 'NEXUS_API') {
          if (detail?.status === 'NO_KEY') return 'NEXUS_API：未读取到 API Key';
          if (detail?.httpStatus) {
            const code = Number(detail.httpStatus);
            if (code === 401 || code === 403) return `NEXUS_API：HTTP ${code}（API Key 被拒绝）`;
            if (code === 429) return 'NEXUS_API：HTTP 429（API 请求额度或频率受限）';
            if (code >= 500) return `NEXUS_API：HTTP ${code}（Nexus 服务端异常）`;
            return `NEXUS_API：HTTP ${code}`;
          }
          if (detail?.error) return `NEXUS_API：${shortText(detail.error, 120)}`;
        }
        return name;
      }).join('；');
    } catch (_) {
      return '';
    }
  }

  function currentExecutorTail(job, payload) {
    const tail = String(payload?.launchLogTail || '');
    if (!tail) return '';
    if (String(job?.status || '').toUpperCase() !== 'FAILED') return shortText(tail, 260);

    const executor = [...tail.matchAll(/EXECUTOR_FAILED\s+([A-Z0-9_]+)/gi)].at(-1);
    const direct = [...tail.matchAll(/DIRECT_DOWNLOAD_FAILED\s+([A-Z0-9_]+)/gi)].at(-1);
    const errorCode = [...tail.matchAll(/errorCode["']?\s*[:=]\s*["']([A-Z0-9_]+)["']/gi)].at(-1);
    const code = executor?.[1] || direct?.[1] || errorCode?.[1] || '';
    if (code) return `执行器错误 ${code}`;

    const failed = [...tail.matchAll(/["']failed["']\s*:\s*(\d+)/gi)].at(-1);
    if (failed && Number(failed[1]) > 0) return `执行器报告 ${failed[1]} 个失败项`;

    if (/REVIEW_SELECTION_INVALID|undefined:undefined/i.test(tail)) {
      return '执行器失败；已忽略上一轮遗留的选择校验日志。';
    }
    return shortText(tail, 260);
  }

  function failureDetail(job, payload) {
    if (Array.isArray(job?.errors) && job.errors.length) {
      const e = job.errors[0] || {};
      return shortText([e.code, e.detail].filter(Boolean).join(': '));
    }
    const checks = failedCheckDetail(job);
    if (checks) return checks;
    if (job?.stderr) return shortText(job.stderr);
    return currentExecutorTail(job, payload);
  }

  function setSummaryPills(live) {
    logSummary.replaceChildren();
    const values = [
      ['计划', live?.planned ?? 0, ''],
      ['VERIFIED', live?.verified ?? 0, 'good'],
      ['失败/阻断', live?.failedOrBlocked ?? 0, live?.failedOrBlocked ? 'danger' : 'good'],
      ['处理中', Array.isArray(live?.active) ? live.active.length : 0, ''],
      ['待处理', live?.pending ?? 0, ''],
    ];
    for (const [label, value, cls] of values) {
      const span = document.createElement('span');
      span.className = `pill${cls ? ' ' + cls : ''}`;
      span.textContent = `${label} ${value}`;
      logSummary.appendChild(span);
    }
  }

  function addLogRow(container, item, kind) {
    const row = document.createElement('div');
    row.className = `download-log-row ${kind}`;
    const top = document.createElement('div');
    top.className = 'download-log-row-top';
    const exact = document.createElement('code');
    exact.textContent = item?.exact || [item?.modId, item?.fileId].filter(Boolean).join(':') || 'unknown';
    const name = document.createElement('span');
    name.className = 'download-log-name';
    name.textContent = item?.name || '未命名文件';
    top.append(exact, name);

    const meta = document.createElement('div');
    meta.className = 'download-log-meta';
    const parts = [];
    if (item?.status) parts.push(`status=${item.status}`);
    if (item?.errorCode) parts.push(`error=${item.errorCode}`);
    if (item?.attempt) parts.push(`attempt=${item.attempt}`);
    if (Array.isArray(item?.attempts) && item.attempts.length) {
      const last = item.attempts[item.attempts.length - 1];
      parts.push(`attempts=${item.attempts.length}`);
      if (last?.errorCode) parts.push(`last=${last.errorCode}`);
    }
    if (item?.localIdentity?.reason) parts.push(`local=${item.localIdentity.reason}`);
    if (item?.verify?.status) parts.push(`verify=${item.verify.status}`);
    meta.textContent = parts.join(' · ');
    row.append(top, meta);
    container.appendChild(row);
  }

  function renderLiveLog(job, payload) {
    const live = job?.liveProgress || null;
    const jobStatus = String(job?.status || (payload?.activePid ? 'STARTING' : '')).toUpperCase();
    if (!job && !payload?.activePid) {
      logPanel.hidden = true;
      return;
    }
    logPanel.hidden = false;
    logState.textContent = payload?.activePid ? (jobStatus || 'RUNNING') : (jobStatus || 'STOPPED');
    logState.classList.toggle('failed', /FAILED|BLOCKED|PREFLIGHT_FAILED/.test(jobStatus));
    logState.classList.toggle('running', !!payload?.activePid);

    setSummaryPills(live || {});

    logActive.replaceChildren();
    const active = Array.isArray(live?.active) ? live.active : [];
    logActiveBlock.hidden = active.length === 0;
    for (const item of active.slice(0, 6)) addLogRow(logActive, item, 'active');

    logFailures.replaceChildren();
    const failures = Array.isArray(live?.failures) ? live.failures : [];
    if (!failures.length) {
      const empty = document.createElement('div');
      empty.className = 'download-log-empty';
      empty.textContent = payload?.activePid ? '暂未发现失败项。' : '本次任务没有记录到失败/阻断项。';
      logFailures.appendChild(empty);
    } else {
      for (const item of failures.slice(0, 30)) addLogRow(logFailures, item, 'failure');
      if (failures.length > 30) {
        const more = document.createElement('div');
        more.className = 'download-log-empty';
        more.textContent = `另有 ${failures.length - 30} 个失败项已写入持久日志。`;
        logFailures.appendChild(more);
      }
    }

    if (payload?.activePid) {
      logFoot.textContent = `实时刷新中 · pid=${payload.activePid} · 约每 0.9 秒刷新一次`;
    } else if (jobStatus) {
      logFoot.textContent = '任务结束后失败详情会保存在 review-failures.json / review-failures.log，并累计到 review-failure-history.jsonl。';
    } else {
      logFoot.textContent = '';
    }
  }

  async function pollReviewJob() {
    try {
      const payload = await get('/api/job');
      const job = payload?.latestJob || null;
      renderLiveLog(job, payload);
      if (payload?.activePid) {
        const phase = job?.status && job.status !== 'COMPLETED' ? job.status : 'STARTING';
        statusEl.textContent = `下载任务运行中 · ${phase} · pid=${payload.activePid}`;
        downloadBtn.disabled = true;
        return;
      }

      if (!payload?.lastExit) return;
      const status = String(job?.status || '').toUpperCase();
      if (status === 'COMPLETED') {
        statusEl.textContent = '下载任务已完成。';
      } else if (status === 'NO_DOWNLOADS') {
        statusEl.textContent = '任务已结束：没有需要下载的文件。';
      } else if (status) {
        const detail = failureDetail(job, payload);
        statusEl.textContent = `下载任务 ${status}${detail ? '：' + detail : ''}`;
      } else {
        const detail = shortText(payload?.lastExit?.error || payload?.launchLogTail || '', 260);
        statusEl.textContent = `下载进程已退出${detail ? '：' + detail : ''}`;
      }
      updateSelectionBar();
    } catch (_) {
      // Keep the picker usable if the transient status endpoint is unavailable.
    }
  }

  setInterval(pollReviewJob, 900);
  setTimeout(pollReviewJob, 250);
})();
</script>
</body>
</html>
