<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TES5 MO2 自动更新 · 文件选择器</title>
  <style>/*__STYLE__*/</style>
</head>
<body>
<div class="wrap">
  <div class="hero" __AUTO_MARKER__>
    <div class="hero-top">
      <div>
        <h1>📦 MO2 更新文件选择器</h1>
        <div class="muted">直接从 Nexus 最近文件里勾选你要下载的项目。一个 MOD 可以多选；未勾选就不会下载。</div>
      </div>
      <div class="run-meta" id="run-meta"></div>
    </div>
    <div id="zero-warning"></div>
    <div class="summary" id="auto-summary"></div>
    <div class="summary" id="summary"></div>
  </div>

  <div class="toolbar">
    <div class="filters" id="filters"></div>
    <div class="toolbar-right">
      <input id="search" class="search" type="search" autocomplete="off" placeholder="搜索 MOD / 文件名 / modId…">
      <span class="visible-status" id="visible-status"></span>
    </div>
  </div>

  <main id="root"></main>
  <div class="more-wrap"><button class="btn secondary" id="more" hidden>显示更多</button></div>
</div>

<div class="selection-bar">
  <div class="selection-left">
    <div class="selection-summary" id="selection-summary">已选择 0 个文件 / 0 个 MOD</div>
    <span class="status" id="status"></span>
  </div>
  <div class="selection-actions">
    <button class="btn secondary" id="clear-selection" disabled>清空选择</button>
    <button class="btn primary" id="download" disabled>下载所选文件</button>
  </div>
</div>

<script>window.REVIEW_DATA=__REVIEW_DATA__;</script>
<script>
(() => {
  if (location.protocol === 'file:') return;
  const nativeFetch = window.fetch.bind(window);

  function badId(value) {
    const s = String(value ?? '').trim();
    return !s || /^(undefined|null)$/i.test(s);
  }

  function componentGroups(item) {
    if (item?.componentFamilies?.length) return item.componentFamilies;
    return (item?.patchFamilies || []).map(f => ({ kind: 'PATCH', ...f }));
  }

  function itemIsActionable(item) {
    if (!item) return false;
    if (item.reviewClass) return item.reviewClass === 'actionable';
    if (item.action === 'HOLD_UPDATE_ELIGIBILITY') return false;
    return (item.mainOptions || []).length > 1 || componentGroups(item).length > 0;
  }

  function allowedExactKeys(item) {
    const source = Array.isArray(item?.recentNexusFiles) && item.recentNexusFiles.length
      ? item.recentNexusFiles
      : [
          ...(item?.mainOptions || []),
          ...componentGroups(item).flatMap(g => (g.candidates || []).filter(x => String(x.modId || item.modId) === String(item.modId))),
        ];
    const out = new Set();
    for (const f of source) {
      const modId = String(f?.modId || item?.modId || '').trim();
      const fileId = String(f?.fileId ?? f?.file_id ?? '').trim();
      const current = !!f?.current || fileId === String(item?.localFileId || '');
      if (badId(modId) || badId(fileId) || current || f?.active === false || f?.selectable === false) continue;
      out.add(`${modId}:${fileId}`);
    }
    return out;
  }

  function normalizeSavedFile(raw, item, allowed) {
    const primitive = typeof raw === 'string' || typeof raw === 'number';
    const rawFileId = primitive ? raw : (raw?.fileId ?? raw?.file_id ?? '');
    const rawModId = primitive ? '' : (raw?.modId ?? raw?.mod_id ?? '');
    const fileId = String(rawFileId ?? '').trim();
    const modId = String(badId(rawModId) ? (item?.modId || '') : rawModId).trim();
    if (badId(modId) || badId(fileId)) return null;
    const key = `${modId}:${fileId}`;
    return allowed.has(key) ? { modId, fileId } : null;
  }

  function repairSavedReviewState(payload) {
    const envelope = payload?.decisions;
    const source = envelope?.decisions && typeof envelope.decisions === 'object'
      ? envelope.decisions
      : (envelope && typeof envelope === 'object' ? envelope : {});
    const items = new Map((window.REVIEW_DATA?.items || []).map(item => [String(item.id), item]));
    const repaired = {};
    let kept = 0;
    let dropped = 0;
    let migrated = 0;

    for (const [id, decision] of Object.entries(source)) {
      const item = items.get(String(id));
      const selected = Array.isArray(decision?.selectedFiles) ? decision.selectedFiles : [];
      if (!item || !itemIsActionable(item) || !selected.length) {
        dropped += selected.length;
        continue;
      }
      const allowed = allowedExactKeys(item);
      const clean = [];
      const seen = new Set();
      for (const raw of selected) {
        const normalized = normalizeSavedFile(raw, item, allowed);
        if (!normalized) {
          dropped++;
          continue;
        }
        if (typeof raw !== 'object' || badId(raw?.modId)) migrated++;
        const key = `${normalized.modId}:${normalized.fileId}`;
        if (seen.has(key)) continue;
        seen.add(key);
        clean.push(normalized);
        kept++;
      }
      if (clean.length) repaired[id] = { selectedFiles: clean };
    }

    if (envelope?.decisions && typeof envelope.decisions === 'object') {
      payload.decisions = { ...envelope, decisions: repaired };
    } else {
      payload.decisions = repaired;
    }
    window.__REVIEW_STATE_REPAIR__ = { kept, dropped, migrated };
    if (dropped > 0) {
      setTimeout(() => {
        const status = document.getElementById('status');
        if (status) status.textContent = `已清理 ${dropped} 个无效旧选择；请重新勾选需要下载的文件。`;
      }, 0);
    }
    return payload;
  }

  window.fetch = async function patchedReviewFetch(input, init) {
    const response = await nativeFetch(input, init);
    try {
      const method = String(init?.method || (input instanceof Request ? input.method : 'GET')).toUpperCase();
      const rawUrl = typeof input === 'string' ? input : input?.url;
      if (method === 'GET' && rawUrl && new URL(rawUrl, location.href).pathname === '/api/state' && response.ok) {
        const payload = repairSavedReviewState(await response.clone().json());
        const headers = new Headers(response.headers);
        headers.delete('content-length');
        return new Response(JSON.stringify(payload), { status: response.status, statusText: response.statusText, headers });
      }
    } catch (_) {
      // If migration itself fails, return the original response and keep the UI usable.
    }
    return response;
  };
})();
</script>
<script>/*__APP__*/</script>
<script>
(() => {
  if (location.protocol === 'file:') return;

  function shortText(value, max = 220) {
    const text = String(value || '').replace(/\s+/g, ' ').trim();
    return text.length > max ? text.slice(0, max) + '…' : text;
  }

  function failedChecks(job) {
    try {
      const doc = JSON.parse(String(job?.stdout || ''));
      const failed = (doc.checks || []).filter(x => x && x.ok === false).map(x => x.name).filter(Boolean);
      return failed.length ? failed.slice(0, 4).join(', ') : '';
    } catch (_) {
      return '';
    }
  }

  function failureDetail(job, payload) {
    if (Array.isArray(job?.errors) && job.errors.length) {
      const e = job.errors[0] || {};
      return shortText([e.code, e.detail].filter(Boolean).join(': '));
    }
    const checks = failedChecks(job);
    if (checks) return '未通过检查：' + checks;
    if (job?.stderr) return shortText(job.stderr);
    const tail = shortText(payload?.launchLogTail || '', 260);
    return tail;
  }

  async function pollReviewJob() {
    try {
      const payload = await get('/api/job');
      const job = payload?.latestJob || null;
      if (payload?.activePid) {
        const phase = job?.status && job.status !== 'COMPLETED' ? job.status : 'STARTING';
        statusEl.textContent = `下载任务运行中 · ${phase} · pid=${payload.activePid}`;
        downloadBtn.disabled = true;
        return;
      }

      if (!payload?.lastExit) return;
      const status = String(job?.status || '').toUpperCase();
      if (status === 'COMPLETED') {
        statusEl.textContent = '下载任务已完成。';
      } else if (status === 'NO_DOWNLOADS') {
        statusEl.textContent = '任务已结束：没有需要下载的文件。';
      } else if (status) {
        const detail = failureDetail(job, payload);
        statusEl.textContent = `下载任务 ${status}${detail ? '：' + detail : ''}`;
      } else {
        const detail = shortText(payload?.lastExit?.error || payload?.launchLogTail || '', 260);
        statusEl.textContent = `下载进程已退出${detail ? '：' + detail : ''}`;
      }
      updateSelectionBar();
    } catch (_) {
      // Keep the picker usable if the transient status endpoint is unavailable.
    }
  }

  setInterval(pollReviewJob, 900);
  setTimeout(pollReviewJob, 250);
})();
</script>
</body>
</html>
